<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--card:#fff;--ink:#1c2a3e;--mut:#6b7a90;--line:#dde3ec;--pri:#1f5fbf;--pri2:#e8f0fc;--ok:#1a7f4b;--warn:#b86e00;--err:#c0392b}

<nav><h1>접근성 실태조사<br>취합 대시보드</h1>
<a data-v="dash">대시보드</a><a data-v="list">조사 결과</a><a data-v="pdf">PDF 업로드</a><a data-v="imp">데이터 가져오기</a><a data-v="rev">검수 관리</a><a data-v="qa">PDF 품질 검수</a><a data-v="qh">검수 이력</a><a data-v="rep">보고서</a><div id="who" style="padding:14px 16px;font-size:11px;color:#9fb6da;word-break:break-all"></div></nav>

<script>
const G=[["corp","법인","t"],["svc","서비스명","t"],["plat","플랫폼","t"],["round","조사 회차","t"],["date","업데이트 일자","t"],
["e_issues","전문가 이슈 수","e"],["e_pages","페이지 수","e"],["e_a","인식의 용이성","e"],["e_b","운용의 용이성","e"],["e_c","이해의 용이성","e"],["e_d","견고성","e"],["e_total","전문가 합계(100점)","e"],
["u_issues","사용자 이슈 수","u"],["u_tasks","과업 수","u"],
["bl_s","전맹 성공","u"],["bl_m","전맹 미흡","u"],["bl_f","전맹 실패","u"],["bl_r","전맹 성공률(%)","u"],
["lo_s","저시력 성공","u"],["lo_m","저시력 미흡","u"],["lo_f","저시력 실패","u"],["lo_r","저시력 성공률(%)","u"],
["up_s","상지 성공","u"],["up_m","상지 미흡","u"],["up_f","상지 실패","u"],["up_r","상지 성공률(%)","u"],["u_avg","평균 성공률(%)","u"],["etc","기타 조사 정보","t"]];
const TXT=["corp","svc","plat","round","date","etc"],ST=["추출 중","검수 대기","확인 필요","검수 완료","오류"],PG=10;
const LB=Object.fromEntries(G.map(g=>[g[0],g[1]]));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(/[,%\s]/g,""));return isNaN(n)?null:n};
const $=s=>document.querySelector(s);
let R=[],S={q:"",corp:"",plat:"",st:"",smp:false,sort:"",dir:1,pg:0,hide:{e:false,u:false}},IM=null,uid=1;
const stamp=()=>new Date().toLocaleString("ko-KR");
function save(){try{localStorage.setItem("sv_recs",JSON.stringify(R))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem("sv_recs"));if(x&&x.length){R=x;uid=Math.max(...R.map(r=>r.id))+1;return}}catch(e){}seed()}
function seed(){const D=[["한국","메신저A","iOS",82,70,[20,22,18,20]],["한국","메신저A","Android",75,64],["한국","쇼핑B","iOS",68,55],["한국","쇼핑B","Android",71,59],["미국","스트리밍C","iOS",90,80],["미국","스트리밍C","Windows",64,48],["일본","뱅킹D","Android",77,66],["일본","뱅킹D","Mac",59,41]];
R=D.map((d,i)=>{const t=d[3],s=10+i,m=3,f=2,tk=s+m+f;const r=mk({corp:d[0],svc:d[1],plat:d[2],round:"2025-1차",date:"2025-06-"+(10+i),e_issues:12+i,e_pages:30,e_a:Math.round(t*.27),e_b:Math.round(t*.27),e_c:Math.round(t*.23),e_d:t-Math.round(t*.27)*2-Math.round(t*.23),e_total:t,u_issues:5,u_tasks:tk,bl_s:s,bl_m:m,bl_f:f,bl_r:d[4],lo_s:s+1,lo_m:2,lo_f:f,lo_r:d[4]+3,up_s:s+2,up_m:1,up_f:f,up_r:d[4]+6,u_avg:d[4]+3});r.sample=true;r.status=i<5?"검수 완료":i<7?"검수 대기":"확인 필요";if(i==7)r.e_total=50;return r});save()}
const CORP_MAP={"카카오":["카카오톡","지갑","오픈채팅","클라우드","채널홈","카카오맵","선물하기","톡딜","쇼핑탭"],"카카오모빌리티":["카카오T","카카오내비","카카오버스"],"카카오엔터테인먼트":["멜론","카카오페이지"],"카카오페이":["톡페이","페이앱"]};
const nsv=x=>String(x||"").replace(/\s+/g,"").toLowerCase();
function corpOf(svc){const t=nsv(svc);if(!t)return"";for(const c in CORP_MAP)if(CORP_MAP[c].some(v=>nsv(v)===t))return c;return""}
function roundOf(d){const m=/(\d{4})\s*[-.\/]\s*(\d{1,2})\s*[-.\/]\s*(\d{1,2})/.exec(String(d||""));if(!m)return"";const mo=+m[2];if(mo<1||mo>12)return"";return`${m[1].slice(2)}년 ${mo<=6?"상반기":"하반기"}`}
function mk(o){const r={id:nid(),sample:false,status:"확인 필요",file:"",hist:[]};G.forEach(g=>r[g[0]]=o[g[0]]??"");if(!String(r.corp).trim()){const c=corpOf(r.svc);if(c)r.corp=c}if(!String(r.round).trim()){const rd=roundOf(r.date);if(rd)r.round=rd}return Object.assign(r,{hist:[{t:stamp(),m:"등록"}]})}
const key=r=>[r.corp,r.svc,r.plat,r.round].map(x=>String(x).trim()).join("|");
function check(r){const e=[],w=[];["corp","svc","plat"].forEach(k=>{if(!String(r[k]).trim())e.push(LB[k]+" 누락")});
if(R.some(o=>o.id!==r.id&&key(o)===key(r)))e.push("중복: 같은 법인·서비스·플랫폼·회차가 이미 있음");
const p=["e_a","e_b","e_c","e_d"].map(k=>num(r[k])),t=num(r.e_total);
if(r.max&&p.every(x=>x!=null)&&t!=null){const c=p.reduce((a,b)=>a+b,0)/r.max.s*100;if(Math.abs(c-t)>.15)w.push(`전문가 합계: 기재 ${t} ↔ 보고서 산식(항목합÷적용배점합×100) ${c.toFixed(1)}`)}
if(!String(r.round).trim())w.push("조사 회차 미입력");
if(t==null)w.push("전문가 합계 미기재 (규칙 미확정으로 자동 계산하지 않음)");
[["bl","전맹"],["lo","저시력"],["up","상지"]].forEach(([k,n])=>{const s=num(r[k+"_s"]),m=num(r[k+"_m"]),f=num(r[k+"_f"]),rt=num(r[k+"_r"]);
if(s!=null&&m!=null&&f!=null){if(num(r.u_tasks)!=null&&s+m+f!==num(r.u_tasks))w.push(`${n}: 성공+미흡+실패(${s+m+f})≠과업 수(${r.u_tasks})`);
const c=s/(s+m+f)*100;if(rt!=null&&Math.abs(c-rt)>.5)w.push(`${n}: 기재 성공률 ${rt}% ↔ 참고 계산 ${c.toFixed(1)}% (성공÷전체 가정, 확정값 아님)`)}
if(rt==null)w.push(n+" 성공률 미기재")});if(r.ext)Object.entries(r.ext).forEach(([k,o])=>{const c=num(r[k]);if(c!=null&&Math.abs(c-o.v)>1e-6)w.push(`${LB[k]}: 현재 ${c} ↔ PDF ${o.v}${o.calc?" (참고 계산)":""} (p.${o.p})`)});return{e,w}}
function derived(r){return r.status==="검수 완료"}
const vis=()=>R.filter(r=>S.smp||!r.sample);
function filt(){const q=S.q.toLowerCase();let a=vis().filter(r=>(!S.corp||r.corp===S.corp)&&(!S.plat||r.plat===S.plat)&&(!S.st||r.status===S.st)&&(!q||[r.corp,r.svc,r.plat,r.round,r.file].join(" ").toLowerCase().includes(q)));
if(S.sort)a=[...a].sort((x,y)=>{let p=x[S.sort],q2=y[S.sort];const n1=num(p),n2=num(q2);return(n1!=null&&n2!=null?n1-n2:String(p).localeCompare(String(q2),"ko"))*S.dir});return a}
const uniq=k=>[...new Set(R.map(r=>r[k]).filter(Boolean))].sort();
const avg=(a,k)=>{const v=a.map(r=>num(r[k])).filter(x=>x!=null);return v.length?{v:v.reduce((x,y)=>x+y,0)/v.length,n:v.length}:null};
function bars(title,unit,rows,max){return`<div class="panel"><h3>${title}</h3><div class="sub">단위: ${unit} · 검수 완료 데이터의 기재값 단순 평균</div>${rows.map(([l,a])=>a?`<div class="bar"><i title="${esc(l)}">${esc(l)}</i><div><u style="width:${Math.min(100,a.v/max*100)}%"></u></div><em>${a.v.toFixed(1)} (n=${a.n})</em></div>`:`<div class="bar"><i>${esc(l)}</i><em>데이터 없음</em></div>`).join("")||'<div class="hint">검수 완료 데이터가 없습니다.</div>'}</div>`}
const views={
dash(){const a=vis(),c=a.filter(derived),by=(k,f)=>uniq(k).map(x=>[x,avg(c.filter(r=>r[k]===x),f)]);
const prog=uniq("corp").map(x=>{const t=a.filter(r=>r.corp===x);return[x,{v:t.filter(derived).length/t.length*100,n:t.length}]});
return`<h2>대시보드</h2><div class="note">확정 통계는 <b>검수 완료</b> 데이터만 반영합니다. ${S.smp?"샘플 데이터 포함 중 (조사 결과 화면에서 끌 수 있음)":""} 전문가 점수와 사용자 성공률은 의미가 달라 합산하지 않습니다.</div>
<div class="cards">${[["전체 법인",new Set(a.map(r=>r.corp)).size],["전체 서비스",new Set(a.map(r=>r.corp+r.svc)).size],["플랫폼별 조사 건수",a.length],["전문가 테스트 완료",c.filter(r=>num(r.e_total)!=null).length],["사용자 테스트 완료",c.filter(r=>num(r.u_avg)!=null||num(r.bl_r)!=null).length],["검수 대기",a.filter(r=>r.status==="검수 대기").length],["확인 필요·오류",a.filter(r=>r.status==="확인 필요"||r.status==="오류").length]].map(x=>`<div class="card"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>
<div class="grid">${bars("법인별 전문가 테스트 합계","점",by("corp","e_total"),100)}${bars("플랫폼별 전문가 테스트 점수","점",by("plat","e_total"),100)}
${bars("서비스별 전문가 테스트 합계","점",uniq("svc").map(x=>[x,avg(c.filter(r=>r.svc===x),"e_total")]),100)}${bars("플랫폼별 사용자 테스트 평균 성공률","%",by("plat","u_avg"),100)}
${bars("장애 유형별 성공률","%",[["시각장애(전맹)",avg(c,"bl_r")],["시각장애(저시력)",avg(c,"lo_r")],["지체장애(상지)",avg(c,"up_r")]],100)}${bars("조사 회차별 전문가 합계","점",by("round","e_total"),100)}
${bars("법인별 검수 완료 비율","% (n=조사 건수)",prog,100)}</div>`},
list(){const a=filt(),pages=Math.max(1,Math.ceil(a.length/PG));S.pg=Math.min(S.pg,pages-1);const cols=G.filter(g=>!S.hide[g[2]]);
const sel=(k,l,v)=>`<select data-f="${k}"><option value="">${l} 전체</option>${v.map(x=>`<option ${S[k]===x?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
return`<h2>조사 결과</h2><div class="tools"><input id="q" placeholder="키워드 검색" value="${esc(S.q)}">${sel("corp","법인",uniq("corp"))}${sel("plat","플랫폼",uniq("plat"))}<select data-f="st"><option value="">검수 상태 전체</option>${ST.map(x=>`<option ${S.st===x?"selected":""}>${x}</option>`).join("")}</select>
<label style="display:none"><input type="checkbox" id="smp" ${S.smp?"checked":""}> 샘플 포함</label><label><input type="checkbox" data-h="e" ${S.hide.e?"":"checked"}> 전문가 열</label><label><input type="checkbox" data-h="u" ${S.hide.u?"":"checked"}> 사용자 열</label><button class="p" id="add">+ 직접 등록</button><button id="fc" title="법인은 서비스명으로, 조사 회차는 업데이트 일자로 빈 칸만 채웁니다">법인·회차 자동 채우기</button><button id="xl">현재 필터 엑셀</button></div>
<div class="tw"><table><thead><tr><th>번호</th>${cols.map(g=>`<th data-s="${g[0]}">${g[1]}${S.sort===g[0]?(S.dir>0?" ▲":" ▼"):""}</th>`).join("")}<th>검수 상태</th></tr></thead><tbody>${a.slice(S.pg*PG,S.pg*PG+PG).map(r=>`<tr class="r" data-id="${r.id}"><td>${r.id}${r.sample?' <span class="tag smp">샘플</span>':""}</td>${cols.map(g=>`<td>${esc(r[g[0]])}</td>`).join("")}<td><span class="tag s-${r.status.replace(" ","")}">${r.status}</span></td></tr>`).join("")||`<tr><td colspan="40">결과가 없습니다.</td></tr>`}</tbody></table></div>
